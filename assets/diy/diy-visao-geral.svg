<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" font-family="Figtree, Helvetica, Arial, sans-serif">
  <title>Visão geral da torre hidropônica caseira</title>
  <rect width="520" height="640" fill="#F5EAD8"/>
  <!-- distribuidor -->
  <path d="M180 70 L260 70 L250 110 L190 110 Z" fill="#AEBF92" stroke="#56633F" stroke-width="2"/>
  <g fill="#56633F"><circle cx="205" cy="104" r="2"/><circle cx="220" cy="104" r="2"/><circle cx="235" cy="104" r="2"/></g>
  <!-- tubo -->
  <rect x="195" y="110" width="50" height="400" fill="#F9F4ED" stroke="#A19786" stroke-width="2"/>
  <!-- curvas e plantas -->
  <g stroke="#A19786" stroke-width="2" fill="#F9F4ED">
    <path d="M195 170 l-28 -22 l10 -12 l28 22 z"/>
    <path d="M245 230 l28 -22 l-10 -12 l-28 22 z"/>
    <path d="M195 290 l-28 -22 l10 -12 l28 22 z"/>
    <path d="M245 350 l28 -22 l-10 -12 l-28 22 z"/>
    <path d="M195 410 l-28 -22 l10 -12 l28 22 z"/>
  </g>
  <g fill="#7A8A5E">
    <ellipse cx="165" cy="128" rx="18" ry="10"/><ellipse cx="275" cy="188" rx="18" ry="10"/>
    <ellipse cx="165" cy="248" rx="18" ry="10"/><ellipse cx="275" cy="308" rx="18" ry="10"/>
    <ellipse cx="165" cy="368" rx="18" ry="10"/>
  </g>
  <!-- gotas -->
  <g fill="#6E93A8"><circle cx="210" cy="140" r="3"/><circle cx="228" cy="200" r="3"/><circle cx="214" cy="270" r="3"/><circle cx="226" cy="340" r="3"/><circle cx="218" cy="420" r="3"/></g>
  <!-- balde -->
  <path d="M140 450 L300 450 L285 590 L155 590 Z" fill="#EBDDC5" stroke="#645C50" stroke-width="2"/>
  <rect x="152" y="500" width="138" height="85" fill="#C6DAE3" opacity="0.8"/>
  <rect x="195" y="450" width="50" height="135" fill="#F9F4ED" stroke="#A19786" stroke-width="2" opacity="0.9"/>
  <!-- bomba e mangueira -->
  <rect x="255" y="555" width="26" height="22" rx="4" fill="#2E2B25"/>
  <path d="M268 555 C 330 520, 330 90, 250 80" fill="none" stroke="#2E2B25" stroke-width="4"/>
  <!-- rótulos -->
  <g font-size="14" fill="#201E1D">
    <line x1="262" y1="72" x2="360" y2="55" stroke="#201E1D"/><text x="365" y="52">Distribuidor</text><text x="365" y="70">("chuveiro")</text>
    <line x1="165" y1="275" x2="100" y2="275" stroke="#201E1D"/><text x="20" y="270">Curvas 45°</text><text x="20" y="288">com mudas</text>
    <line x1="245" y1="300" x2="360" y2="300" stroke="#201E1D" stroke-dasharray="3 3"/><text x="365" y="305">Tubo PVC branco</text>
    <line x1="330" y1="400" x2="360" y2="400" stroke="#201E1D"/><text x="365" y="405">Mangueira opaca</text>
    <line x1="281" y1="566" x2="360" y2="566" stroke="#201E1D"/><text x="365" y="571">Bomba de aquário</text>
    <line x1="155" y1="560" x2="140" y2="560" stroke="#201E1D"/><text x="20" y="555">Balde com</text><text x="20" y="573">solução</text>
  </g>
  <text x="260" y="625" font-size="13" text-anchor="middle" fill="#645C50">Ilustração esquemática — fora de escala</text>
</svg>
