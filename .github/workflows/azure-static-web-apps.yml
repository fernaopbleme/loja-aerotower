name: Deploy loja AeroTower (Azure Static Web Apps)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build e deploy
    steps:
      - uses: actions/checkout@v4

      - name: Instala o Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Baixa as dependencias
        run: flutter pub get

      - name: Analisa
        run: flutter analyze

      - name: Testes
        run: flutter test

      # O build sai em build/web e ja inclui staticwebapp.config.json,
      # porque o Flutter copia tudo que esta em web/.
      - name: Build web
        run: flutter build web --release

      - name: Deploy para o Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: build/web
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Fecha o ambiente de preview
    steps:
      - name: Fecha
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
